<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Inventario Tienda</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --brand:#0f766e; --brand-strong:#0b5a54; --brand-soft:#e7f3f1; --brand-line:#b9dcd7;
    --side:#0d1b1f; --side-2:#16343a; --side-text:#c7d0dc; --side-muted:#8592a5;
    --bg:#f5f6f4; --card:#fff; --card-2:#f8f9f7; --text:#18212b; --muted:#667085; --line:#e6e8e3;
    --danger:#c2334d; --danger-soft:#fcecef; --warn:#a15c07; --warn-soft:#fdf3e1; --ok:#137a52; --ok-soft:#e5f5ec; --info:#2f5fd0; --info-soft:#e9effc;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04); --shadow-lg:0 12px 40px rgba(16,24,40,.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --brand-strong:#5ec4b8; --brand-soft:#123430; --brand-line:#1f5a53; --side:#080d10; --side-2:#13292c;
    --bg:#0e1217; --card:#161b22; --card-2:#1b212a; --text:#e6e9ee; --muted:#93a0b0; --line:#262d37;
    --danger:#f07a8e; --danger-soft:#3a1c24; --warn:#f2b656; --warn-soft:#3a2b12; --ok:#5fd09b; --ok-soft:#12301f; --info:#7ea2f5; --info-soft:#18233d;
    --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;color:inherit}
  input,select{font:inherit;color:var(--text);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
  h1,h2,h3{margin:0;letter-spacing:-.01em}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .btn{border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;background:var(--card)}
  .btn:hover{background:var(--card-2);border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
  .btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-lg{padding:13px 20px;font-size:1.02rem;border-radius:12px}
  .link{background:none;border:0;color:var(--brand-strong);font-weight:600;padding:5px 8px;border-radius:8px}
  .link:hover{background:var(--brand-soft)}
  .link.danger{color:var(--danger)} .link.danger:hover{background:var(--danger-soft)}
  .ico{width:18px;height:18px;flex:none}

  .pantalla{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 60%),var(--bg)}
  .login-card{background:var(--card);padding:34px;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;border:1px solid var(--line)}
  .login-card .btn{width:100%;margin-top:20px}
  .marca{display:flex;align-items:center;gap:12px}
  .marca-logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
  .marca b{display:block;line-height:1.25}
  .msg{font-size:.9rem;margin-top:12px;min-height:1.2em} .msg.error{color:var(--danger)}

  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  aside{background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
  aside .marca{padding:4px 8px 18px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  aside .marca b{color:#fff}
  aside .small{color:var(--side-muted)}
  .nav-btn{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--side-text);text-align:left;width:100%;position:relative}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-btn.activa{background:var(--side-2);color:#fff;font-weight:600}
  .nav-btn.activa::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#5ec4b8}
  .pie{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
  .pie .yo{padding:0 12px 10px;font-size:.85rem;color:var(--side-muted);word-break:break-all}
  main{padding:28px 32px;max-width:1180px;width:100%;margin:0 auto}
  .encabezado{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .encabezado h1{font-size:1.55rem;font-weight:700}
  .encabezado p{margin:4px 0 0;color:var(--muted)}
  .topbar{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr} aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
    aside .marca{border:0;padding:0 8px;margin:0} .nav-btn{width:auto} .nav-btn.activa::before{display:none} .pie{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center} .pie .yo{display:none}
    main{padding:18px 16px}
  }

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:16px}
  .panel h2{font-size:1.02rem;font-weight:650;margin-bottom:2px}
  .panel .sub{margin:0 0 14px;color:var(--muted);font-size:.88rem}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .kpi:nth-child(2)::before{background:var(--danger)} .kpi:nth-child(3)::before{background:var(--info)} .kpi:nth-child(4)::before{background:var(--warn)}
  .kpi span{color:var(--muted);font-size:.82rem;font-weight:500}
  .kpi strong{display:block;font-size:1.55rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tabla-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow)}
  .panel .tabla-wrap{box-shadow:none}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
  th{background:var(--card-2);color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,transparent)}
  tr.clic{cursor:pointer}
  tr:last-child td{border-bottom:0}
  .vacio{text-align:center;color:var(--muted);padding:32px!important}
  .badge{padding:3px 10px;border-radius:999px;font-weight:600;font-size:.78rem;display:inline-block;white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.no{background:var(--danger-soft);color:var(--danger)}
  .badge.aviso{background:var(--warn-soft);color:var(--warn)} .badge.neutro{background:var(--card-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
  .badge.dueno{background:var(--brand-soft);color:var(--brand-strong)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:inline-grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
  .persona{display:flex;align-items:center;gap:10px}
  .persona b{display:block;font-weight:600}
  .filtros{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .filtros input{flex:1;min-width:220px} .filtros select{width:auto}
  .volver{margin:-6px 0 10px -8px}
  .acciones{white-space:nowrap;text-align:right}
  .clave{display:flex;gap:8px} .clave input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}
  .credenciales{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;white-space:pre-wrap;margin-top:12px}

  .modal-fondo{position:fixed;inset:0;background:rgba(8,12,18,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
  .modal h2{font-size:1.2rem;margin-bottom:4px}
  .modal-acciones{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
  .seccion-modal{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line)}
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 32px)}
  .toast{background:#1d2530;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:500;border-left:4px solid #5fd09b}
  .toast.error{border-left-color:#f07a8e}
</style>
</head>
<body>
<div id="toasts"></div>

<!-- Ingreso -->
<section id="vLogin" class="pantalla hidden">
  <form class="login-card" id="fLogin">
    <div class="marca"><div class="marca-logo" id="logoLogin"></div><div><b>Panel de administración</b><span class="muted small">Inventario Tienda</span></div></div>
    <p class="muted small" style="margin:18px 0 0">Acceso exclusivo para el administrador del software.</p>
    <label>Correo</label><input type="email" id="lEmail" required autocomplete="email">
    <label>Contraseña</label><input type="password" id="lClave" required autocomplete="current-password">
    <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
    <div class="msg" id="lMsg"></div>
  </form>
</section>

<!-- Panel -->
<div id="vPanel" class="app hidden">
  <aside>
    <div class="marca"><div class="marca-logo" id="logoPanel"></div><div><b>Administración</b><span class="small">Inventario Tienda</span></div></div>
    <button class="nav-btn" data-vista="tiendas" id="navTiendas"></button>
    <button class="nav-btn" data-vista="usuarios" id="navUsuarios"></button>
    <div class="pie"><div class="yo" id="yo"></div><button class="nav-btn" id="bSalir"></button></div>
  </aside>
  <main id="contenido"></main>
</div>
<div id="modales"></div>

<script>
const SUPABASE_URL = 'https://iibwvxuchcoeyzrmocju.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fUlURD_H_Tzg5TY1LFp6Ew_nn1pfOMB';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const URL_APP = location.href.split('#')[0].split('?')[0].replace(/admin\.html$/, '');

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => '$' + Math.round(Number(n || 0)).toLocaleString('es-CO');
const correoValido = e => /^\S+@\S+\.\S+$/.test(e);
const fechaCorta = f => f ? new Date(f).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const hace = f => {
  if (!f) return 'Nunca ha entrado';
  const m = Math.round((Date.now() - new Date(f)) / 60000);
  if (m < 2) return 'Hace un momento'; if (m < 60) return `Hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `Hace ${h} h`;
  const d = Math.round(h / 24); return d < 30 ? `Hace ${d} día${d > 1 ? 's' : ''}` : fechaCorta(f);
};
const iniciales = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const generarClave = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = crypto.getRandomValues(new Uint32Array(10)); return Array.from(a, x => c[x % c.length]).join(''); };

const ICONOS = {
  tiendas: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 01-6 0 3 3 0 01-6 0 3 3 0 01-6 0V9z"/><path d="M5 13v8h14v-8"/>',
  usuarios: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 15c2.5.6 4 2.5 4 6"/>',
  escudo: '<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>',
  salir: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  mas: '<path d="M12 5v14M5 12h14"/>',
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[n]}</svg>`;

function aviso(t, tipo = '') {
  const el = document.createElement('div'); el.className = 'toast ' + tipo; el.textContent = t;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), tipo === 'error' ? 6000 : 3500);
}
const errorTexto = e => {
  const m = e?.message || String(e);
  if (/Failed to send a request|FunctionsFetchError|404/i.test(m)) return 'La función "admin-usuarios" no está instalada en Supabase. Revisa el paso de instalación.';
  if (/duplicate key|23505/.test(m)) return 'Ese correo ya está registrado.';
  if (/row-level security|permission denied/.test(m)) return 'No tienes permiso para hacer esto.';
  return m;
};

function abrirModal(html, alCerrar) {
  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  fondo.innerHTML = `<div class="modal">${html}</div>`;
  $('modales').appendChild(fondo);
  const m = { el: fondo.firstElementChild, cerrar: () => { if (!fondo.isConnected) return; fondo.remove(); pila.splice(pila.indexOf(m), 1); alCerrar && alCerrar(); } };
  pila.push(m);
  fondo.addEventListener('mousedown', e => { if (e.target === fondo) m.cerrar(); });
  m.el.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = m.cerrar);
  setTimeout(() => m.el.querySelector('[autofocus]')?.focus(), 30);
  return m;
}
function confirmar(titulo, texto, ok = 'Aceptar', peligro = false) {
  return new Promise(res => {
    let r = false;
    const m = abrirModal(`<h2>${esc(titulo)}</h2><p class="muted" style="white-space:pre-line">${esc(texto)}</p>
      <div class="modal-acciones"><button class="btn" data-cerrar>Cancelar</button><button class="btn ${peligro ? 'btn-danger' : 'btn-primary'}" id="cOk" autofocus>${esc(ok)}</button></div>`, () => res(r));
    m.el.querySelector('#cOk').onclick = () => { r = true; m.cerrar(); };
  });
}
const pila = [];
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pila.length) pila.at(-1).cerrar(); });

// Llamar la función segura de cuentas
async function cuentas(cuerpo) {
  const { data, error } = await db.functions.invoke('admin-usuarios', { body: cuerpo });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j?.error) m = j.error; } catch (e) {}
    throw new Error(m);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

/* ---------- Estado ---------- */
let yo = null, tiendas = [], vista = 'tiendas';

/* ---------- Ingreso ---------- */
$('logoLogin').innerHTML = ico('escudo'); $('logoPanel').innerHTML = ico('escudo');
$('navTiendas').innerHTML = ico('tiendas') + 'Tiendas';
$('navUsuarios').innerHTML = ico('usuarios') + 'Usuarios';
$('bSalir').innerHTML = ico('salir') + 'Cerrar sesión';
document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => ir(b.dataset.vista));
$('bSalir').onclick = async () => { await db.auth.signOut(); location.reload(); };

$('fLogin').onsubmit = async e => {
  e.preventDefault();
  $('lMsg').className = 'msg'; $('lMsg').textContent = 'Un momento...';
  const { error } = await db.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lClave').value });
  if (error) { $('lMsg').className = 'msg error'; $('lMsg').textContent = 'Correo o contraseña incorrectos.'; return; }
  iniciar();
};

async function iniciar() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $('vLogin').classList.remove('hidden'); $('vPanel').classList.add('hidden'); return; }
  const { data: adm } = await db.from('administradores').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!adm) {
    await db.auth.signOut();
    $('vLogin').classList.remove('hidden');
    $('lMsg').className = 'msg error'; $('lMsg').textContent = 'Esta cuenta no es de administrador.';
    return;
  }
  yo = session.user;
  $('yo').textContent = yo.email;
  $('vLogin').classList.add('hidden'); $('vPanel').classList.remove('hidden');
  ir('tiendas');
}

function ir(v) {
  vista = v;
  document.querySelectorAll('[data-vista]').forEach(b => b.classList.toggle('activa', b.dataset.vista === v));
  v === 'tiendas' ? verTiendas() : verUsuarios();
}
const encabezado = (t, sub, acc = '') => `<div class="encabezado"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row">${acc}</div></div>`;
async function cargarTiendas() {
  const { data, error } = await db.rpc('admin_tiendas');
  if (error) throw error;
  tiendas = data || [];
}

/* ---------- Tiendas ---------- */
async function verTiendas() {
  $('contenido').innerHTML = encabezado('Tiendas', 'Todas las tiendas que usan tu software', `<button class="btn btn-primary" id="bNueva">${ico('mas')}Nueva tienda</button>`) + '<div id="cuerpo" class="muted">Cargando...</div>';
  $('bNueva').onclick = modalNuevaTienda;
  try { await cargarTiendas(); } catch (e) { $('cuerpo').textContent = errorTexto(e); return; }
  const act = tiendas.filter(t => t.estado === 'activa');
  $('cuerpo').className = '';
  $('cuerpo').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>Tiendas activas</span><strong>${act.length}</strong></div>
      <div class="kpi"><span>Suspendidas</span><strong>${tiendas.length - act.length}</strong></div>
      <div class="kpi"><span>Usuarios en total</span><strong>${tiendas.reduce((t, x) => t + Number(x.usuarios), 0)}</strong></div>
      <div class="kpi"><span>Ventas del mes (todas)</span><strong>${pesos(tiendas.reduce((t, x) => t + Number(x.ventas_mes), 0))}</strong></div>
    </div>
    <div class="tabla-wrap"><table>
      <thead><tr><th>Tienda</th><th>Dueño</th><th class="num">Usuarios</th><th class="num">Productos</th><th class="num">Ventas del mes</th><th>Estado</th></tr></thead>
      <tbody>${tiendas.length ? tiendas.map(t => `<tr class="clic" data-id="${t.id}">
        <td><b>${esc(t.nombre)}</b><br><span class="small muted">Desde ${fechaCorta(t.creado_en)}</span></td>
        <td>${esc(t.dueno || '')}${!t.dueno ? '<span class="badge aviso">Sin dueño</span>' : ''}</td>
        <td class="num">${t.usuarios}</td><td class="num">${t.productos}</td><td class="num">${pesos(t.ventas_mes)}</td>
        <td><span class="badge ${t.estado === 'activa' ? 'ok' : 'no'}">${t.estado === 'activa' ? 'Activa' : 'Suspendida'}</span></td></tr>`).join('')
        : '<tr><td colspan="6" class="vacio">Aún no hay tiendas. Crea la primera con "Nueva tienda".</td></tr>'}</tbody>
    </table></div>`;
  $('cuerpo').querySelectorAll('[data-id]').forEach(r => r.onclick = () => verTienda(Number(r.dataset.id)));
}

function modalNuevaTienda() {
  const clave = generarClave();
  const m = abrirModal(`
    <h2>Nueva tienda</h2><p class="muted small">Crea la tienda y la cuenta de su dueño en un solo paso.</p>
    <div class="grid2">
      <div><label>Nombre de la tienda *</label><input id="tNombre" autofocus placeholder="Ej: Minimercado La Esquina"></div>
      <div><label>NIT o cédula</label><input id="tNit"></div>
      <div><label>Dirección</label><input id="tDir"></div>
      <div><label>Teléfono</label><input id="tTel"></div>
    </div>
    <div class="seccion-modal">Cuenta del dueño</div>
    <div class="grid2">
      <div><label>Nombre *</label><input id="dNombre" placeholder="Nombre y apellido"></div>
      <div><label>Correo *</label><input type="email" id="dEmail" placeholder="dueno@correo.com"></div>
    </div>
    <label>Contraseña inicial *</label>
    <div class="clave"><input id="dClave" value="${clave}"><button class="btn" id="dGen" type="button">Generar otra</button></div>
    <div class="modal-acciones"><button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="tCrear">Crear tienda</button></div>`);
  const el = s => m.el.querySelector(s);
  el('#dGen').onclick = () => el('#dClave').value = generarClave();
  el('#tCrear').onclick = async () => {
    const t = { nombre: el('#tNombre').value.trim(), nit: el('#tNit').value.trim() || null, direccion: el('#tDir').value.trim() || null, telefono: el('#tTel').value.trim() || null };
    const d = { nombre: el('#dNombre').value.trim(), email: el('#dEmail').value.trim().toLowerCase(), password: el('#dClave').value.trim() };
    if (!t.nombre) return aviso('Escribe el nombre de la tienda.', 'error');
    if (!d.nombre || !correoValido(d.email)) return aviso('Escribe el nombre y un correo válido del dueño.', 'error');
    if (d.password.length < 6) return aviso('La contraseña debe tener mínimo 6 caracteres.', 'error');
    el('#tCrear').disabled = true; el('#tCrear').textContent = 'Creando...';
    const { data: id, error } = await db.rpc('admin_crear_tienda', { p_nombre: t.nombre, p_email: d.email });
    if (error) { el('#tCrear').disabled = false; el('#tCrear').textContent = 'Crear tienda'; return aviso(errorTexto(error), 'error'); }
    await db.from('tiendas').update(t).eq('id', id);
    try {
      await cuentas({ accion: 'crear', tienda_id: id, rol: 'dueno', ...d });
      m.cerrar();
      mostrarCredenciales(d.nombre, d.email, d.password, t.nombre);
    } catch (e) {
      m.cerrar();
      aviso(`La tienda se creó, pero la cuenta del dueño no: ${errorTexto(e)}`, 'error');
    }
    verTienda(id);
  };
}

async function verTienda(id) {
  $('contenido').innerHTML = '<p class="muted">Cargando...</p>';
  const { data: t, error } = await db.from('tiendas').select('*').eq('id', id).single();
  if (error) { $('contenido').textContent = errorTexto(error); return; }
  const activa = t.estado === 'activa';
  $('contenido').innerHTML = `
    <button class="link volver" id="bVolver">← Todas las tiendas</button>
    ${encabezado(`${esc(t.nombre)} <span class="badge ${activa ? 'ok' : 'no'}" style="vertical-align:middle;margin-left:6px">${activa ? 'Activa' : 'Suspendida'}</span>`, `Cliente desde ${fechaCorta(t.creado_en)}`,
      `<button class="btn ${activa ? 'btn-danger' : ''}" id="bEstado">${activa ? 'Suspender tienda' : 'Reactivar tienda'}</button>`)}
    <div class="panel">
      <h2>Datos de la tienda</h2><p class="sub">Aparecen en el tiquete y los reportes. El dueño no puede cambiarlos.</p>
      <div class="grid2">
        <div><label style="margin-top:0">Nombre de la tienda *</label><input id="eNombre" value="${esc(t.nombre)}"></div>
        <div><label style="margin-top:0">NIT o cédula</label><input id="eNit" value="${esc(t.nit || '')}"></div>
        <div><label>Dirección</label><input id="eDir" value="${esc(t.direccion || '')}"></div>
        <div><label>Teléfono</label><input id="eTel" value="${esc(t.telefono || '')}"></div>
      </div>
      <div class="modal-acciones" style="margin-top:16px"><button class="btn btn-primary" id="bGuardar">Guardar datos</button></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div><h2>Usuarios</h2><p class="sub" style="margin:0">Cuentas que pueden entrar a esta tienda</p></div>
        <button class="btn btn-primary" id="bNuevoU">${ico('mas')}Nuevo usuario</button>
      </div>
      <div id="tablaU" class="muted">Cargando...</div>
    </div>`;
  $('bVolver').onclick = () => ir('tiendas');
  $('bGuardar').onclick = async () => {
    const datos = { nombre: $('eNombre').value.trim(), nit: $('eNit').value.trim() || null, direccion: $('eDir').value.trim() || null, telefono: $('eTel').value.trim() || null };
    if (!datos.nombre) return aviso('El nombre es obligatorio.', 'error');
    const { error } = await db.from('tiendas').update(datos).eq('id', id);
    if (error) return aviso(errorTexto(error), 'error');
    aviso('Datos guardados');
  };
  $('bEstado').onclick = async () => {
    const nuevo = activa ? 'suspendida' : 'activa';
    if (nuevo === 'suspendida' && !await confirmar('Suspender tienda', `Nadie de "${t.nombre}" podrá entrar hasta que la reactives. Sus datos se conservan.`, 'Suspender', true)) return;
    const { error } = await db.rpc('admin_estado_tienda', { p_tienda: id, p_estado: nuevo });
    if (error) return aviso(errorTexto(error), 'error');
    aviso(nuevo === 'activa' ? 'Tienda reactivada' : 'Tienda suspendida');
    verTienda(id);
  };
  $('bNuevoU').onclick = () => modalUsuario(null, id, () => pintarUsuarios($('tablaU'), id));
  pintarUsuarios($('tablaU'), id);
}

/* ---------- Usuarios ---------- */
async function verUsuarios() {
  $('contenido').innerHTML = encabezado('Usuarios', 'Todas las cuentas de todas las tiendas', `<button class="btn btn-primary" id="bNuevoU">${ico('mas')}Nuevo usuario</button>`) +
    `<div class="filtros"><input type="search" id="fTexto" placeholder="Buscar por nombre o correo..."><select id="fTienda"><option value="">Todas las tiendas</option></select><select id="fEstado"><option value="">Todos</option><option value="activo">Activos</option><option value="bloqueado">Bloqueados</option></select></div>
     <div id="tablaU" class="muted">Cargando...</div>`;
  try { await cargarTiendas(); } catch (e) {}
  $('fTienda').innerHTML += tiendas.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('');
  $('bNuevoU').onclick = () => modalUsuario(null, null, () => pintarUsuarios($('tablaU'), null));
  const filtrar = () => pintarUsuarios($('tablaU'), null, true);
  $('fTexto').oninput = filtrar; $('fTienda').onchange = filtrar; $('fEstado').onchange = filtrar;
  pintarUsuarios($('tablaU'), null);
}

let cacheUsuarios = [];
async function pintarUsuarios(cont, tiendaId, soloFiltrar = false) {
  if (!soloFiltrar) {
    try { cacheUsuarios = (await cuentas({ accion: 'listar', tienda_id: tiendaId || undefined })).usuarios; }
    catch (e) { cont.className = ''; cont.innerHTML = `<div class="panel" style="border-color:var(--warn)"><b>No se pudieron cargar las cuentas.</b><p class="muted small" style="margin:4px 0 0">${esc(errorTexto(e))}</p></div>`; return; }
  }
  if (!cont.isConnected) return;
  let lista = cacheUsuarios;
  const global = !tiendaId;
  if (global && $('fTexto')) {
    const t = $('fTexto').value.trim().toLowerCase(), ti = $('fTienda').value, es = $('fEstado').value;
    lista = lista.filter(u => (!t || (u.nombre || '').toLowerCase().includes(t) || u.email.includes(t)) && (!ti || String(u.tienda_id) === ti) && (!es || (es === 'bloqueado') === u.bloqueado));
  }
  cont.className = '';
  cont.innerHTML = `<div class="tabla-wrap"><table>
    <thead><tr><th>Persona</th>${global ? '<th>Tienda</th>' : ''}<th>Rol</th><th>Estado</th><th>Último ingreso</th><th></th></tr></thead>
    <tbody>${lista.length ? lista.map(u => `<tr>
      <td><div class="persona"><span class="avatar">${esc(iniciales(u.nombre || u.email))}</span><span><b>${esc(u.nombre || '—')}${u.es_yo ? ' <span class="small muted">(tú)</span>' : ''}</b><span class="small muted">${esc(u.email)}</span></span></div></td>
      ${global ? `<td>${esc(u.tienda)}</td>` : ''}
      <td><span class="badge ${u.rol === 'dueno' ? 'dueno' : 'neutro'}">${u.rol === 'dueno' ? 'Dueño' : 'Cajero'}</span></td>
      <td><span class="badge ${u.bloqueado ? 'no' : 'ok'}">${u.bloqueado ? 'Bloqueado' : 'Activo'}</span></td>
      <td class="small muted">${hace(u.ultimo_ingreso)}</td>
      <td class="acciones"><button class="link" data-editar="${u.user_id}">Editar</button>${u.es_yo ? '' : `<button class="link ${u.bloqueado ? '' : 'danger'}" data-bloq="${u.user_id}">${u.bloqueado ? 'Desbloquear' : 'Bloquear'}</button><button class="link danger" data-elim="${u.user_id}">Eliminar</button>`}</td>
    </tr>`).join('') : `<tr><td colspan="${global ? 6 : 5}" class="vacio">Sin usuarios.</td></tr>`}</tbody></table></div>`;

  const recargar = () => pintarUsuarios(cont, tiendaId);
  const porId = id => cacheUsuarios.find(u => u.user_id === id);
  cont.querySelectorAll('[data-editar]').forEach(b => b.onclick = () => modalUsuario(porId(b.dataset.editar), tiendaId, recargar));
  cont.querySelectorAll('[data-bloq]').forEach(b => b.onclick = async () => {
    const u = porId(b.dataset.bloq);
    if (!u.bloqueado && !await confirmar('Bloquear cuenta', `${u.nombre || u.email} no podrá entrar hasta que la desbloquees. Su historial se conserva.`, 'Bloquear', true)) return;
    try { await cuentas({ accion: 'bloquear', user_id: u.user_id, bloquear: !u.bloqueado }); aviso(u.bloqueado ? 'Cuenta desbloqueada' : 'Cuenta bloqueada'); recargar(); }
    catch (e) { aviso(errorTexto(e), 'error'); }
  });
  cont.querySelectorAll('[data-elim]').forEach(b => b.onclick = async () => {
    const u = porId(b.dataset.elim);
    if (!await confirmar('Eliminar cuenta', `Se elimina la cuenta de ${u.nombre || u.email} para siempre. Las ventas que hizo se conservan en los reportes.\n\nSi solo quieres que no entre por un tiempo, usa "Bloquear".`, 'Eliminar', true)) return;
    try { await cuentas({ accion: 'eliminar', user_id: u.user_id }); aviso('Cuenta eliminada'); recargar(); }
    catch (e) { aviso(errorTexto(e), 'error'); }
  });
}

function modalUsuario(u, tiendaFija, alGuardar) {
  const nuevo = !u;
  const clave = nuevo ? generarClave() : '';
  const opcTiendas = tiendas.map(t => `<option value="${t.id}" ${(u ? u.tienda_id : tiendaFija) === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('');
  const m = abrirModal(`
    <h2>${nuevo ? 'Nuevo usuario' : 'Editar usuario'}</h2>
    <p class="muted small">${nuevo ? 'La persona podrá entrar de inmediato con este correo y contraseña.' : 'Cambia los datos que necesites. La contraseña solo cambia si escribes una nueva.'}</p>
    <div class="grid2">
      <div><label>Nombre *</label><input id="uNombre" value="${esc(u?.nombre || '')}" autofocus placeholder="Nombre y apellido"></div>
      <div><label>Correo *</label><input type="email" id="uEmail" value="${esc(u?.email || '')}" placeholder="persona@correo.com"></div>
      <div><label>Tienda</label><select id="uTienda" ${u?.es_yo ? 'disabled' : ''}>${opcTiendas || '<option value="">Cargando...</option>'}</select></div>
      <div><label>Rol</label><select id="uRol" ${u?.es_yo ? 'disabled' : ''}><option value="cajero" ${u?.rol !== 'dueno' ? 'selected' : ''}>Cajero</option><option value="dueno" ${u?.rol === 'dueno' ? 'selected' : ''}>Dueño</option></select></div>
    </div>
    <label>${nuevo ? 'Contraseña *' : 'Nueva contraseña (opcional)'}</label>
    <div class="clave"><input id="uClave" value="${clave}" placeholder="${nuevo ? '' : 'Déjala vacía para no cambiarla'}"><button class="btn" id="uGen" type="button">Generar</button></div>
    <p class="small muted" style="margin:6px 0 0">El cajero vende, abre caja, registra entradas y fiados. El dueño además ve costos, reportes y configura su tienda.</p>
    <div class="modal-acciones"><button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="uGuardar">${nuevo ? 'Crear usuario' : 'Guardar cambios'}</button></div>`);
  const el = s => m.el.querySelector(s);
  if (!tiendas.length) cargarTiendas().then(() => { el('#uTienda').innerHTML = tiendas.map(t => `<option value="${t.id}" ${(u ? u.tienda_id : tiendaFija) === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join(''); }).catch(() => {});
  el('#uGen').onclick = () => el('#uClave').value = generarClave();
  el('#uGuardar').onclick = async () => {
    const d = { nombre: el('#uNombre').value.trim(), email: el('#uEmail').value.trim().toLowerCase(), tienda_id: Number(el('#uTienda').value), rol: el('#uRol').value, password: el('#uClave').value.trim() };
    if (!d.nombre || !correoValido(d.email)) return aviso('Escribe el nombre y un correo válido.', 'error');
    if (!d.tienda_id) return aviso('Elige la tienda.', 'error');
    if ((nuevo || d.password) && d.password.length < 6) return aviso('La contraseña debe tener mínimo 6 caracteres.', 'error');
    el('#uGuardar').disabled = true;
    try {
      if (nuevo) await cuentas({ accion: 'crear', ...d });
      else {
        const cambios = { accion: 'editar', user_id: u.user_id, nombre: d.nombre, email: d.email };
        if (d.password) cambios.password = d.password;
        if (!u.es_yo) { cambios.rol = d.rol; cambios.tienda_id = d.tienda_id; }
        await cuentas(cambios);
      }
      m.cerrar();
      if (nuevo || d.password) mostrarCredenciales(d.nombre, d.email, d.password, tiendas.find(t => t.id === d.tienda_id)?.nombre || '');
      else aviso('Cambios guardados');
      alGuardar && alGuardar();
    } catch (e) { el('#uGuardar').disabled = false; aviso(errorTexto(e), 'error'); }
  };
}

function mostrarCredenciales(nombre, email, clave, tienda) {
  const texto = `Hola ${nombre.split(' ')[0]}, este es tu acceso a ${tienda || 'la tienda'}:\n\nEnlace: ${URL_APP}\nCorreo: ${email}\nContraseña: ${clave}`;
  const m = abrirModal(`<h2>Acceso listo</h2><p class="muted small">Envíale estos datos a la persona. Por seguridad, esta contraseña no se vuelve a mostrar.</p>
    <div class="credenciales">${esc(texto)}</div>
    <div class="modal-acciones"><button class="btn" id="cCopiar">Copiar</button><button class="btn" id="cWa">Enviar por WhatsApp</button><button class="btn btn-primary" data-cerrar>Listo</button></div>`);
  m.el.querySelector('#cCopiar').onclick = async () => { try { await navigator.clipboard.writeText(texto); aviso('Copiado'); } catch (e) { aviso('No se pudo copiar; selecciona el texto y cópialo.', 'error'); } };
  m.el.querySelector('#cWa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}

iniciar();
</script>
</body>
</html>
