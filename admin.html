<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Inventario Tienda</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--brand:#111827;--bg:#f4f5f7;--card:#fff;--text:#1f2933;--muted:#6b7280;--line:#e5e7eb;--ok:#15803d;--ok-soft:#ecfdf5;--danger:#dc2626;--danger-soft:#fef2f2;--warn:#b45309;--warn-soft:#fffbeb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--brand:#e5e7eb;--bg:#0f1115;--card:#181b21;--text:#e7e9ee;--muted:#9aa3b2;--line:#2a2f38;--ok:#4ade80;--ok-soft:#163323;--danger:#f87171;--danger-soft:#3a1d1d;--warn:#fbbf24;--warn-soft:#3a2f14;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
  button{font:inherit;cursor:pointer;color:inherit}
  input,select{font:inherit;color:var(--text);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
  label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px;font-weight:500}
  h1,h2,h3{margin:0}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:600;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:var(--bg)}
  .btn-danger{color:var(--danger)}
  .link{background:none;border:0;font-weight:600;padding:4px 6px;border-radius:6px;color:var(--text);text-decoration:underline;text-underline-offset:3px}
  .link.danger{color:var(--danger)}
  .centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .tarjeta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  .login{width:100%;max-width:380px}
  .login .btn{width:100%;margin-top:18px}
  .msg{font-size:.9rem;margin-top:10px;min-height:1.2em} .msg.error{color:var(--danger)} .msg.ok{color:var(--ok)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  header b{font-size:1.05rem}
  main{max-width:900px;margin:0 auto;padding:24px 16px}
  .fila{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .fila > .crece{flex:1;min-width:200px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}}
  .lista{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .tienda{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%}
  .tienda:hover{border-color:var(--muted)}
  .tienda b{font-size:1.05rem}
  .badge{padding:2px 10px;border-radius:999px;font-weight:600;font-size:.8rem;display:inline-block;white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.no{background:var(--danger-soft);color:var(--danger)} .badge.aviso{background:var(--warn-soft);color:var(--warn)}
  table{width:100%;border-collapse:collapse}
  td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .der{text-align:right}
  .seccion{margin-top:16px}
  .seccion h2{font-size:1.05rem;margin-bottom:4px}
  .volver{margin-bottom:12px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:12px 18px;border-radius:10px;font-weight:500;z-index:9;max-width:calc(100vw - 32px)}
  #toast.error{background:var(--danger);color:#fff}
</style>
</head>
<body>

<!-- Ingreso -->
<section id="vLogin" class="centro hidden">
  <form class="tarjeta login" id="fLogin">
    <h1 style="font-size:1.3rem">Panel de administración</h1>
    <p class="muted small" style="margin:4px 0 8px">Solo para el administrador del software.</p>
    <label>Correo</label><input type="email" id="lEmail" required autocomplete="email">
    <label>Contraseña</label><input type="password" id="lClave" required autocomplete="current-password">
    <button class="btn btn-primary" type="submit">Entrar</button>
    <div class="msg" id="lMsg"></div>
  </form>
</section>

<!-- Panel -->
<section id="vPanel" class="hidden">
  <header><b>Panel de administración</b><div><span class="muted small" id="yo"></span> <button class="link" id="bSalir">Salir</button></div></header>
  <main id="contenido"></main>
</section>

<div id="toast" class="hidden"></div>

<script>
const SUPABASE_URL = 'https://iibwvxuchcoeyzrmocju.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fUlURD_H_Tzg5TY1LFp6Ew_nn1pfOMB';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => '$' + Math.round(Number(n || 0)).toLocaleString('es-CO');
const correoValido = e => /^\S+@\S+\.\S+$/.test(e);
let yo = null, tiendas = [];

function aviso(t, tipo = '') {
  const el = $('toast'); el.textContent = t; el.className = tipo;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'hidden', tipo === 'error' ? 6000 : 3000);
}
const errorTexto = e => {
  const m = e?.message || String(e);
  if (/duplicate key|23505/.test(m)) return 'Ese correo ya está registrado en una tienda.';
  if (/row-level security|permission denied|Solo el administrador/.test(m)) return 'No tienes permiso para hacer esto.';
  return m;
};

// ---------- Ingreso ----------
$('fLogin').onsubmit = async e => {
  e.preventDefault();
  $('lMsg').className = 'msg'; $('lMsg').textContent = 'Un momento...';
  const { error } = await db.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lClave').value });
  if (error) { $('lMsg').className = 'msg error'; $('lMsg').textContent = 'Correo o contraseña incorrectos.'; return; }
  iniciar();
};
$('bSalir').onclick = async () => { await db.auth.signOut(); location.reload(); };

async function iniciar() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $('vLogin').classList.remove('hidden'); $('vPanel').classList.add('hidden'); return; }
  const { data: adm } = await db.from('administradores').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!adm) {
    await db.auth.signOut();
    $('vLogin').classList.remove('hidden');
    $('lMsg').className = 'msg error'; $('lMsg').textContent = 'Esta cuenta no es de administrador.';
    return;
  }
  yo = session.user;
  $('yo').textContent = yo.email;
  $('vLogin').classList.add('hidden'); $('vPanel').classList.remove('hidden');
  verTiendas();
}

// ---------- Lista de tiendas ----------
async function verTiendas() {
  $('contenido').innerHTML = `
    <div class="tarjeta">
      <h2 style="font-size:1.1rem">Nueva tienda</h2>
      <p class="muted small" style="margin:4px 0 0">Se crea la tienda y queda registrado el correo del dueño.</p>
      <div class="fila">
        <div class="crece"><label>Nombre de la tienda</label><input id="nNombre" placeholder="Ej: Minimercado La Esquina"></div>
        <div class="crece"><label>Correo del dueño</label><input type="email" id="nEmail" placeholder="dueno@correo.com"></div>
        <button class="btn btn-primary" id="bCrear">Crear tienda</button>
      </div>
    </div>
    <div class="lista" id="lista"><p class="muted">Cargando tiendas...</p></div>`;
  $('bCrear').onclick = crearTienda;

  const { data, error } = await db.rpc('admin_tiendas');
  if (error) { $('lista').innerHTML = `<p class="muted">${esc(errorTexto(error))}</p>`; return; }
  tiendas = data;
  $('lista').innerHTML = tiendas.length ? tiendas.map(t => `
    <button class="tienda" data-id="${t.id}">
      <span><b>${esc(t.nombre)}</b><br><span class="small muted">${esc(t.dueno || t.invitacion || 'Sin dueño')} · ${t.usuarios} usuario(s) · ${t.productos} productos · ${pesos(t.ventas_mes)} este mes</span></span>
      <span class="badge ${t.estado === 'activa' ? 'ok' : 'no'}">${t.estado === 'activa' ? 'Activa' : 'Suspendida'}</span>
    </button>`).join('') : '<p class="muted">Aún no hay tiendas.</p>';
  $('lista').querySelectorAll('[data-id]').forEach(b => b.onclick = () => verTienda(Number(b.dataset.id)));
}

async function crearTienda() {
  const nombre = $('nNombre').value.trim(), email = $('nEmail').value.trim().toLowerCase();
  if (!nombre || !correoValido(email)) return aviso('Escribe el nombre y un correo válido.', 'error');
  const { data, error } = await db.rpc('admin_crear_tienda', { p_nombre: nombre, p_email: email });
  if (error) return aviso(errorTexto(error), 'error');
  aviso(`Tienda "${nombre}" creada`);
  verTienda(data);
}

// ---------- Detalle de una tienda ----------
async function verTienda(id) {
  const { data: t, error } = await db.from('tiendas').select('*').eq('id', id).single();
  if (error) return aviso(errorTexto(error), 'error');
  $('contenido').innerHTML = `
    <button class="link volver" id="bVolver">← Todas las tiendas</button>
    <div class="tarjeta">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <h1 style="font-size:1.3rem">${esc(t.nombre)}</h1>
        <span class="badge ${t.estado === 'activa' ? 'ok' : 'no'}">${t.estado === 'activa' ? 'Activa' : 'Suspendida'}</span>
      </div>
      <div class="grid2">
        <div><label>Nombre de la tienda</label><input id="dNombre" value="${esc(t.nombre)}"></div>
        <div><label>NIT o cédula</label><input id="dNit" value="${esc(t.nit || '')}"></div>
        <div><label>Dirección</label><input id="dDir" value="${esc(t.direccion || '')}"></div>
        <div><label>Teléfono</label><input id="dTel" value="${esc(t.telefono || '')}"></div>
      </div>
      <div class="fila" style="justify-content:space-between;margin-top:16px">
        <button class="btn ${t.estado === 'activa' ? 'btn-danger' : ''}" id="bEstado">${t.estado === 'activa' ? 'Suspender tienda' : 'Reactivar tienda'}</button>
        <button class="btn btn-primary" id="bGuardar">Guardar datos</button>
      </div>
    </div>

    <div class="tarjeta seccion">
      <h2>Usuarios</h2>
      <p class="muted small" style="margin:0 0 8px">La persona entra a la app, toca "Activar cuenta" con su correo, crea su contraseña y la confirma desde su correo.</p>
      <div id="usuarios" class="muted">Cargando...</div>
      <div class="fila" style="margin-top:12px">
        <div class="crece"><label>Agregar correo</label><input type="email" id="uEmail" placeholder="persona@correo.com"></div>
        <div><label>Rol</label><select id="uRol"><option value="cajero">Cajero</option><option value="dueno">Dueño</option></select></div>
        <button class="btn btn-primary" id="bAgregar">Agregar</button>
      </div>
    </div>`;

  $('bVolver').onclick = verTiendas;
  $('bGuardar').onclick = async () => {
    const datos = { nombre: $('dNombre').value.trim(), nit: $('dNit').value.trim() || null, direccion: $('dDir').value.trim() || null, telefono: $('dTel').value.trim() || null };
    if (!datos.nombre) return aviso('El nombre es obligatorio.', 'error');
    const { error } = await db.from('tiendas').update(datos).eq('id', id);
    if (error) return aviso(errorTexto(error), 'error');
    aviso('Datos guardados');
  };
  $('bEstado').onclick = async () => {
    const nuevo = t.estado === 'activa' ? 'suspendida' : 'activa';
    if (nuevo === 'suspendida' && !confirm(`¿Suspender "${t.nombre}"? Sus usuarios no podrán entrar hasta que la reactives. Los datos se conservan.`)) return;
    const { error } = await db.rpc('admin_estado_tienda', { p_tienda: id, p_estado: nuevo });
    if (error) return aviso(errorTexto(error), 'error');
    aviso(nuevo === 'activa' ? 'Tienda reactivada' : 'Tienda suspendida');
    verTienda(id);
  };
  $('bAgregar').onclick = async () => {
    const email = $('uEmail').value.trim().toLowerCase();
    if (!correoValido(email)) return aviso('Escribe un correo válido.', 'error');
    const { data: ya } = await db.from('usuarios_tienda').select('tienda_id').eq('email', email).maybeSingle();
    if (ya) return aviso('Ese correo ya pertenece a una tienda.', 'error');
    const { error } = await db.from('invitaciones').insert({ tienda_id: id, email, rol: $('uRol').value });
    if (error) return aviso(errorTexto(error), 'error');
    $('uEmail').value = '';
    aviso(`${email} agregado. Ya puede activar su cuenta.`);
    pintarUsuarios(id);
  };
  pintarUsuarios(id);
}

async function pintarUsuarios(id) {
  const [{ data: us }, { data: inv }] = await Promise.all([
    db.from('usuarios_tienda').select('*').eq('tienda_id', id).order('creado_en'),
    db.from('invitaciones').select('*').eq('tienda_id', id).order('creado_en'),
  ]);
  const cont = $('usuarios');
  if (!cont) return;
  const filas = [
    ...(us || []).map(u => `<tr><td>${esc(u.email)}${u.user_id === yo.id ? ' <span class="small muted">(tú)</span>' : ''}</td>
      <td>${u.user_id === yo.id ? 'Dueño' : `<select data-rol="${u.user_id}" style="width:auto;padding:5px 8px"><option value="cajero" ${u.rol === 'cajero' ? 'selected' : ''}>Cajero</option><option value="dueno" ${u.rol === 'dueno' ? 'selected' : ''}>Dueño</option></select>`}</td>
      <td><span class="badge ok">Activo</span></td>
      <td class="der">${u.user_id === yo.id ? '' : `<button class="link danger" data-quitar="${u.user_id}">Quitar</button>`}</td></tr>`),
    ...(inv || []).map(i => `<tr><td>${esc(i.email)}</td><td>${i.rol === 'dueno' ? 'Dueño' : 'Cajero'}</td>
      <td><span class="badge aviso">Sin activar</span></td>
      <td class="der"><button class="link danger" data-cancelar="${i.id}">Quitar</button></td></tr>`),
  ];
  cont.className = '';
  cont.innerHTML = filas.length ? `<table><thead><tr><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>${filas.join('')}</tbody></table>` : '<p class="muted">Sin usuarios.</p>';
  cont.querySelectorAll('[data-rol]').forEach(s => s.onchange = async () => {
    const { error } = await db.from('usuarios_tienda').update({ rol: s.value }).eq('user_id', s.dataset.rol);
    aviso(error ? errorTexto(error) : 'Rol actualizado', error ? 'error' : '');
  });
  cont.querySelectorAll('[data-quitar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Quitar este usuario? Ya no podrá entrar a la tienda. Su historial se conserva.')) return;
    const { error } = await db.from('usuarios_tienda').delete().eq('user_id', b.dataset.quitar);
    if (error) return aviso(errorTexto(error), 'error');
    pintarUsuarios(id);
  });
  cont.querySelectorAll('[data-cancelar]').forEach(b => b.onclick = async () => {
    const { error } = await db.from('invitaciones').delete().eq('id', b.dataset.cancelar);
    if (error) return aviso(errorTexto(error), 'error');
    pintarUsuarios(id);
  });
}

iniciar();
</script>
</body>
</html>
