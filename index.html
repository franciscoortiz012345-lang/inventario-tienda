<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Tienda</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* ===== Sistema de diseño ===== */
  :root{
    --brand:#0f766e;
    --brand-strong:color-mix(in srgb,var(--brand) 78%,black);
    --brand-soft:color-mix(in srgb,var(--brand) 10%,var(--card));
    --brand-line:color-mix(in srgb,var(--brand) 28%,var(--card));
    --side:color-mix(in srgb,var(--brand) 16%,#0b1220);
    --side-2:color-mix(in srgb,var(--brand) 26%,#0b1220);
    --side-text:#c7d0dc; --side-muted:#8592a5;
    --bg:#f5f6f4; --card:#ffffff; --card-2:#f8f9f7; --text:#18212b; --muted:#667085; --line:#e6e8e3;
    --danger:#c2334d; --danger-soft:#fcecef; --warn:#a15c07; --warn-soft:#fdf3e1; --ok:#137a52; --ok-soft:#e5f5ec;
    --info:#2f5fd0; --info-soft:#e9effc;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
    --shadow-lg:0 12px 40px rgba(16,24,40,.18);
    --radius:12px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0e1217; --card:#161b22; --card-2:#1b212a; --text:#e6e9ee; --muted:#93a0b0; --line:#262d37;
    --danger:#f07a8e; --danger-soft:#3a1c24; --warn:#f2b656; --warn-soft:#3a2b12; --ok:#5fd09b; --ok-soft:#12301f;
    --info:#7ea2f5; --info-soft:#18233d;
    --brand-strong:color-mix(in srgb,var(--brand) 55%,white);
    --brand-soft:color-mix(in srgb,var(--brand) 18%,var(--card));
    --side:color-mix(in srgb,var(--brand) 10%,#080b10);
    --side-2:color-mix(in srgb,var(--brand) 22%,#080b10);
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font:inherit;color:var(--text);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);transition:border-color .15s,box-shadow .15s}
  input:hover,select:hover{border-color:color-mix(in srgb,var(--muted) 40%,var(--line))}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  input:disabled{background:var(--card-2);color:var(--muted);cursor:not-allowed}
  label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
  h1,h2,h3{margin:0;letter-spacing:-.01em}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .small{font-size:.85rem}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

  /* Botones */
  .btn{border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;background:var(--card);transition:background .15s,border-color .15s,transform .05s}
  .btn:hover{border-color:color-mix(in srgb,var(--muted) 45%,var(--line));background:var(--card-2)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px color-mix(in srgb,var(--brand) 40%,transparent)}
  .btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
  .btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-lg{padding:14px 22px;font-size:1.05rem;border-radius:12px}
  .btn-sm{padding:6px 11px;font-size:.85rem}
  .btn-ghost{background:none;border-color:transparent}
  .btn-ghost:hover{background:var(--card-2);border-color:transparent}
  .ico{width:18px;height:18px;flex:none}
  .link{background:none;border:0;color:var(--brand-strong);font-weight:600;padding:5px 8px;border-radius:8px}
  .link:hover{background:var(--brand-soft)}
  .link.danger{color:var(--danger)}
  .link.danger:hover{background:var(--danger-soft)}

  /* Ingreso */
  .pantalla{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%),
               radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 60%),var(--bg)}
  .login-card{background:var(--card);padding:34px;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;border:1px solid var(--line)}
  .login-card h2{font-size:1.25rem;margin:22px 0 2px}
  .marca{display:flex;align-items:center;gap:12px}
  .marca-logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .marca-logo img{width:100%;height:100%;object-fit:cover;background:#fff}
  .marca b{display:block;font-size:1.05rem;line-height:1.25}
  .login-card .btn{width:100%;margin-top:20px}
  .msg{font-size:.9rem;margin-top:12px;min-height:1.2em}
  .msg.error{color:var(--danger)} .msg.ok{color:var(--ok)}

  /* Estructura */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  aside .marca{padding:4px 8px 18px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  aside .marca b{color:#fff;font-size:.98rem}
  aside .muted,aside .small{color:var(--side-muted)}
  .nav-btn{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--side-text);text-align:left;width:100%;position:relative;transition:background .15s,color .15s}
  .nav-btn .ico{opacity:.8}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-btn.activa{background:var(--side-2);color:#fff;font-weight:600}
  .nav-btn.activa .ico{opacity:1;color:color-mix(in srgb,var(--brand) 45%,white)}
  .nav-btn.activa::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:color-mix(in srgb,var(--brand) 55%,white)}
  .aside-pie{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
  .aside-pie .usuario{padding:0 12px 10px;line-height:1.35}
  .aside-pie .usuario b{color:#fff;display:block;font-weight:600}
  .rol{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;margin-top:4px}
  main{padding:28px 32px;max-width:1220px;width:100%;margin:0 auto}
  .encabezado{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .encabezado h1{font-size:1.55rem;font-weight:700}
  .encabezado p{margin:4px 0 0;color:var(--muted)}
  .topbar-movil{display:none}
  kbd{font-family:inherit;font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--card-2)}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
    aside.abierto{transform:none}
    .topbar-movil{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--side);color:#fff;position:sticky;top:0;z-index:20}
    .topbar-movil .btn{color:#fff}
    main{padding:18px 16px}
  }
  .velo{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:25}

  /* Tarjetas */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:16px}
  .panel h2{font-size:1.02rem;font-weight:650;margin-bottom:2px}
  .panel .sub{margin:0 0 14px;color:var(--muted);font-size:.88rem}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .kpi span{color:var(--muted);font-size:.82rem;font-weight:500}
  .kpi strong{display:block;font-size:1.55rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kpi.alerta::before{background:var(--danger)} .kpi.alerta strong{color:var(--danger)}
  .kpi.bueno::before{background:var(--ok)} .kpi.bueno strong{color:var(--ok)}
  .kpis .kpi:nth-child(4n+2):not(.alerta):not(.bueno)::before{background:var(--info)}
  .kpis .kpi:nth-child(4n+3):not(.alerta):not(.bueno)::before{background:var(--warn)}
  .acciones-rapidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .accion{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-weight:600;box-shadow:var(--shadow);text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
  .accion:hover{border-color:var(--brand-line);box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 12%,transparent);transform:translateY(-1px)}
  .accion .ico-caja{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;flex:none}
  .acciones-rapidas .accion:nth-child(2) .ico-caja{background:var(--info-soft);color:var(--info)}
  .acciones-rapidas .accion:nth-child(3) .ico-caja{background:var(--warn-soft);color:var(--warn)}
  .acciones-rapidas .accion:nth-child(4) .ico-caja{background:var(--danger-soft);color:var(--danger)}
  .accion small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
  .dos-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dos-col > .panel{margin-top:0}
  @media (max-width:900px){.dos-col{grid-template-columns:1fr}}

  /* Tablas */
  .tabla-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
  .panel .tabla-wrap{box-shadow:none}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
  th{background:var(--card-2);color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:color-mix(in srgb,var(--brand) 4%,transparent)}
  tr:last-child td{border-bottom:0}
  th.num,td.num{text-align:right}
  .vacio{text-align:center;color:var(--muted);padding:32px!important}
  .badge{padding:3px 10px;border-radius:999px;font-weight:600;font-size:.78rem;display:inline-block;white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.bajo{background:var(--danger-soft);color:var(--danger)}
  .badge.aviso{background:var(--warn-soft);color:var(--warn)}
  .badge.neutro{background:var(--card-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
  .barra-mini{height:6px;background:var(--brand-soft);border-radius:4px;margin-top:7px}
  .barra-mini i{display:block;height:100%;background:var(--brand);border-radius:4px}
  .filtros{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .filtros input[type=search]{flex:1;min-width:220px}
  .filtros select{width:auto}

  /* Buscador */
  .buscador{position:relative}
  .grupo{display:flex;gap:8px}
  .grupo input{flex:1}
  .btn-cam{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 13px;display:grid;place-items:center;color:var(--brand-strong)}
  .btn-cam:hover{border-color:var(--brand);background:var(--brand-soft)}
  .resultados{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:8;max-height:330px;overflow-y:auto}
  .resultados div{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
  .resultados div:last-child{border-bottom:0}
  .resultados div:hover,.resultados div.sel{background:var(--brand-soft)}

  /* Vender */
  .pos{display:grid;grid-template-columns:1fr 370px;gap:18px;align-items:start}
  @media (max-width:1000px){.pos{grid-template-columns:1fr}}
  .cobro{position:sticky;top:20px;border-top:4px solid var(--brand)}
  .total-grande{font-size:2.4rem;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.03em;color:var(--text)}
  .linea-total{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
  .medios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .medios button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 4px;font-weight:600;font-size:.84rem;color:var(--muted);transition:all .12s}
  .medios button:hover{border-color:var(--brand-line);color:var(--text)}
  .medios button.activa{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
  .billetes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .billetes button{background:var(--card-2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 11px;font-weight:600;font-size:.82rem}
  .billetes button:hover{border-color:var(--brand);color:var(--brand-strong)}
  .cambio{border-radius:12px;padding:12px 14px;background:var(--card-2);border:1px solid var(--line);margin-top:12px}
  .cambio span{color:var(--muted);font-size:.82rem;font-weight:500}
  .cambio strong{display:block;font-size:1.75rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .cambio.ok{background:var(--ok-soft);border-color:transparent} .cambio.ok strong{color:var(--ok)}
  .cambio.falta{background:var(--danger-soft);border-color:transparent} .cambio.falta strong{color:var(--danger)}
  .cant{width:84px;text-align:right;padding:6px 8px}
  .aviso-caja{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600;flex-wrap:wrap}
  .quitar{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:8px}
  .quitar:hover{color:var(--danger);background:var(--danger-soft)}

  /* Periodos */
  .periodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:end}
  .periodos .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:600;color:var(--muted);font-size:.9rem}
  .periodos .chip:hover{border-color:var(--brand-line);color:var(--text)}
  .periodos .chip.activa{background:var(--brand);border-color:var(--brand);color:#fff}
  .periodos .fecha{width:150px}
  .periodos label{margin-top:0}

  /* Ventanas */
  .modal-fondo{position:fixed;inset:0;background:rgba(8,12,18,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:aparece .15s ease-out}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
  .modal.ancho{max-width:780px}
  .modal h2{font-size:1.2rem;margin-bottom:4px}
  .modal-acciones{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
  @keyframes aparece{from{opacity:0}}
  #lector{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px}
  #lector video{width:100%!important}

  /* Avisos */
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 32px)}
  .toast{background:#1d2530;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:500;animation:entra .2s ease-out;border-left:4px solid var(--brand)}
  .toast.error{border-left-color:#f07a8e}
  .toast.ok{border-left-color:#5fd09b}
  @keyframes entra{from{transform:translateY(8px);opacity:0}}
  #offline{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;text-align:center;padding:6px;font-weight:600;z-index:90}

  /* Mi tienda */
  .colores{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .colores button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
  .colores button.activa{box-shadow:0 0 0 2px var(--text)}
  .colores input[type=color]{width:46px;height:36px;padding:3px}
  .logo-prev{width:76px;height:76px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--card-2);color:var(--muted)}
  .logo-prev img{width:100%;height:100%;object-fit:contain}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand-strong);border-radius:999px;padding:4px 6px 4px 12px;font-size:.88rem;font-weight:500}
  .chips button{border:0;background:none;color:inherit;opacity:.6;border-radius:50%;width:22px;height:22px}
  .chips button:hover{opacity:1;color:var(--danger);background:var(--danger-soft)}

  /* Tiquete (solo al imprimir) */
  #tiquete{display:none}
  @media print{
    body *{visibility:hidden}
    #tiquete,#tiquete *{visibility:visible}
    #tiquete{display:block;position:absolute;left:0;top:0;color:#000;background:#fff;font-family:"Courier New",monospace;font-size:12px;padding:4mm}
    #tiquete .c{text-align:center}
    #tiquete img{max-width:30mm;max-height:20mm;display:block;margin:0 auto 4px}
    #tiquete hr{border:0;border-top:1px dashed #000;margin:6px 0}
    #tiquete table{width:100%;border-collapse:collapse}
    #tiquete td{padding:1px 0;border:0;font-size:12px;color:#000}
    #tiquete .r{text-align:right}
    #tiquete .t{font-weight:bold;font-size:14px}
  }
</style>
</head>
<body>

<div id="offline" class="hidden">Sin conexión a internet. Los cambios no se guardarán hasta que vuelva.</div>
<div id="toasts"></div>

<!-- ========== LOGIN ========== -->
<section id="pantallaLogin" class="pantalla hidden">
  <div class="login-card">
    <div class="marca"><div class="marca-logo" id="logoLogin"></div><div><b class="nombreProducto"></b><span class="muted small">Ventas e inventario para tu tienda</span></div></div>
    <h2>Iniciar sesión</h2>
    <p class="muted small" style="margin:0 0 6px">Entra con el correo y la contraseña que te entregó el administrador.</p>
    <form id="formLogin">
      <label>Correo</label>
      <input type="email" id="email" required autocomplete="email">
      <label>Contraseña</label>
      <input type="password" id="password" required minlength="6" autocomplete="current-password">
      <button class="btn btn-primary btn-lg" type="submit" id="btnLogin">Entrar</button>
      <div class="msg" id="msgLogin"></div>

// Traer todas las filas (Supabase entrega máximo 1000 por consulta)
async function todo(armar) {
  let salida = [], desde = 0;
  const lote = 1000;
  for (;;) {
    const { data, error } = await armar().range(desde, desde + lote - 1);
    if (error) throw error;
    salida = salida.concat(data || []);
    if (!data || data.length < lote) break;
    desde += lote;
  }
  return salida;
}

function cargarScript(src) {
  return new Promise((ok, mal) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}

    E.proveedores = prov.data || [];

function montarBuscador(inputId, resId, alElegir) {
  const input = $(inputId), res = $(resId);
  let lista = [], sel = 0;
  const pintar = () => {
    lista = coincidencias(input.value); sel = 0;
    if (!input.value.trim()) { res.classList.add('hidden'); return; }

    res.classList.remove('hidden');
  };
  const elegir = p => { alElegir(p); input.value = ''; res.classList.add('hidden'); };
  input.addEventListener('input', pintar);
  res.addEventListener('mousedown', e => { const f = e.target.closest('[data-i]'); if (f) { e.preventDefault(); elegir(lista[+f.dataset.i]); } });
  input.addEventListener('blur', () => setTimeout(() => res.classList.add('hidden'), 150));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!lista.length) return; e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + lista.length) % lista.length;
      res.querySelectorAll('[data-i]').forEach((d, i) => d.classList.toggle('sel', i === sel));
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const texto = input.value.trim();
    if (!texto) return;
    const exacto = activos().find(p => p.codigo_barras === texto);
    if (exacto) return elegir(exacto);
    if (lista.length) return elegir(lista[sel]);
    codigoNoRegistrado(texto);
    input.value = ''; res.classList.add('hidden');
  });
}
async function codigoNoRegistrado(codigo) {
  if (!esDueno()) return aviso(`El producto "${codigo}" no está registrado. Pide al dueño que lo cree.`, 'error');
  if (await preguntar('Producto no registrado', `El código "${codigo}" no existe. ¿Quieres crear el producto?`, { ok: 'Crear producto' })) {
    modalProducto(null, /^\d+$/.test(codigo) ? codigo : '');
  }
}
function elegirPorCodigo(codigo, alElegir) {
  const p = activos().find(x => x.codigo_barras === codigo);
  if (p) alElegir(p); else codigoNoRegistrado(codigo);
}

async function verInicio() {
  const c = $('contenido');
  const nombre = (E.nombre || '').split(' ')[0];
  c.innerHTML = encabezado(`Hola, ${esc(nombre)}`, new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' })) +
    `<div class="acciones-rapidas">
      <button class="accion" data-ir="vender"><span class="ico-caja">${ico('vender')}</span><span>Nueva venta<small>Cobrar a un cliente</small></span></button>
      <button class="accion" data-ir="caja"><span class="ico-caja">${ico('caja')}</span><span>${E.caja ? 'Caja abierta' : 'Abrir caja'}<small>${E.caja ? 'Desde ' + fechaHora(E.caja.abierta_en) : 'Necesaria para vender'}</small></span></button>

      <button class="accion" data-ir="clientes"><span class="ico-caja">${ico('clientes')}</span><span>Fiados<small>${pesos(E.clientes.reduce((t, x) => t + Math.max(x.saldo, 0), 0))} por cobrar</small></span></button>
    </div>
    <div class="kpis" id="kpisHoy"><div class="kpi"><span>Cargando...</span><strong>&nbsp;</strong></div></div>
    <div class="dos-col">
      <div class="panel"><h2>Stock bajo</h2><p class="sub">Productos en o por debajo del mínimo</p><div id="listaBajo"></div></div>
      <div class="panel"><h2>Por vencer</h2><p class="sub">Según la última entrada con fecha de vencimiento</p><div id="listaVence"></div></div>
    </div>
    <div class="panel" style="margin-top:16px"><h2>Pedido sugerido por proveedor</h2><p class="sub">Para volver a tener el doble del stock mínimo</p><div id="pedido"></div></div>`;
  c.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => irA(b.dataset.ir));

  // Ventas de hoy
  try {
    const ventas = await todo(() => db.from('ventas').select('total, movimientos(cantidad, costo_unitario, tipo, producto_id)').eq('estado', 'activa').gte('fecha', inicioDia(new Date()).toISOString()));
    if (!$('kpisHoy')) return;
    const total = ventas.reduce((t, v) => t + Number(v.total), 0);
    const costo = ventas.reduce((t, v) => t + (v.movimientos || []).filter(m => m.tipo === 'venta').reduce((a, m) => a + Number(m.cantidad) * Number(m.costo_unitario ?? prodPorId(m.producto_id)?.precio_compra ?? 0), 0), 0);
    const bajo = activos().filter(p => Number(p.stock_minimo) > 0 && p.stock <= Number(p.stock_minimo));
    $('kpisHoy').innerHTML = `
      <div class="kpi"><span>Vendido hoy</span><strong>${pesos(total)}</strong></div>
      <div class="kpi"><span>Ventas hoy</span><strong>${ventas.length}</strong></div>
      ${esDueno() ? `<div class="kpi bueno"><span>Ganancia hoy</span><strong>${pesos(total - costo)}</strong></div>` : ''}
      <div class="kpi ${bajo.length ? 'alerta' : ''}"><span>Con stock bajo</span><strong>${bajo.length}</strong></div>`;
  } catch (e) { $('kpisHoy').innerHTML = ''; aviso(errorTexto(e), 'error'); }

  // Stock bajo
  const bajo = activos().filter(p => Number(p.stock_minimo) > 0 && p.stock <= Number(p.stock_minimo)).sort((a, b) => a.stock - b.stock);
  $('listaBajo').innerHTML = bajo.length ? `<div class="tabla-wrap"><table><tbody>${bajo.slice(0, 10).map(p =>
    `<tr><td>${esc(p.nombre)}</td><td class="num"><span class="badge bajo">${numero(p.stock)}</span> <span class="small muted">mín ${numero(p.stock_minimo)}</span></td></tr>`).join('')}</tbody></table></div>${bajo.length > 10 ? `<p class="small muted">y ${bajo.length - 10} más…</p>` : ''}`
    : '<p class="muted">Todo en orden.</p>';

  // Por vencer
  try {
    const ent = await todo(() => db.from('movimientos').select('producto_id, fecha_vencimiento, fecha').eq('tipo', 'entrada').not('fecha_vencimiento', 'is', null).order('fecha', { ascending: false }));
    if (!$('listaVence')) return;
    const ultima = {};
    ent.forEach(m => { if (!ultima[m.producto_id]) ultima[m.producto_id] = m.fecha_vencimiento; });
    const limite = aFecha(sumarDias(new Date(), 30)), hoy = aFecha(new Date());
    const lista = Object.entries(ultima).map(([id, f]) => ({ p: prodPorId(Number(id)), f }))
      .filter(x => x.p && x.p.activo && x.p.stock > 0 && x.f <= limite).sort((a, b) => a.f.localeCompare(b.f));
    $('listaVence').innerHTML = lista.length ? `<div class="tabla-wrap"><table><tbody>${lista.slice(0, 10).map(x => {
      const vencido = x.f < hoy, dias = Math.round((new Date(x.f + 'T00:00:00') - inicioDia(new Date())) / 864e5);
      return `<tr><td>${esc(x.p.nombre)}<br><span class="small muted">Stock ${numero(x.p.stock)}</span></td><td class="num"><span class="badge ${vencido ? 'bajo' : dias <= 7 ? 'aviso' : 'neutro'}">${vencido ? 'Vencido' : dias === 0 ? 'Vence hoy' : 'En ' + dias + ' días'}</span><br><span class="small muted">${fechaCorta(x.f + 'T00:00:00')}</span></td></tr>`;
    }).join('')}</tbody></table></div>` : '<p class="muted">Nada por vencer en los próximos 30 días.</p>';
  } catch (e) { if ($('listaVence')) $('listaVence').innerHTML = ''; }
  if (!$('pedido')) return;

  // Pedido sugerido
  const porProv = {};
  bajo.forEach(p => {
    const k = p.proveedor_id || 0;
    (porProv[k] ||= []).push({ p, cant: Math.max(Math.ceil(Number(p.stock_minimo) * 2 - p.stock), 1) });
  });
  const claves = Object.keys(porProv);
  $('pedido').innerHTML = claves.length ? claves.map(k => {
    const prov = E.proveedores.find(x => x.id === Number(k));
    return `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><strong>${esc(prov?.nombre || 'Sin proveedor asignado')}</strong>
      ${prov ? `<button class="btn btn-sm" data-wa="${k}">${ico('whatsapp')}Enviar pedido</button>` : ''}</div>
      <div class="small muted">${porProv[k].map(x => `${numero(x.cant)} × ${esc(x.p.nombre)}`).join(' · ')}</div></div>`;
  }).join('') : '<p class="muted">No hay productos para pedir.</p>';
  $('pedido').querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const prov = E.proveedores.find(x => x.id === Number(b.dataset.wa));
    const texto = `Hola ${prov.contacto || prov.nombre}, de ${E.tienda.nombre} quiero hacer este pedido:\n` + porProv[b.dataset.wa].map(x => `- ${numero(x.cant)} ${x.p.nombre}`).join('\n') + '\nGracias.';
    abrirWhatsApp(prov.telefono, texto);
  });
}

/* =====================================================================
   VENDER
   ===================================================================== */
const totalesVenta = () => {
  const sub = E.carrito.reduce((t, i) => t + i.cantidad * Number(prodPorId(i.id)?.precio_venta || 0), 0);
  const desc = Math.min(Number($('descuento')?.value || 0), sub);
  return { sub, desc, total: Math.max(sub - desc, 0) };
};

function verVender() {

  $('contenido').innerHTML = encabezado('Vender', 'Escanea o busca el producto y toca Cobrar') +

        <label style="margin-top:0">Medio de pago</label>
        <div class="medios" id="medios">${Object.entries(MEDIOS).map(([k, v]) => `<button data-medio="${k}" class="${E.medio === k ? 'activa' : ''}">${v}</button>`).join('')}</div>
        <div id="zonaEfectivo">

          <p class="small muted" id="saldoClienteVenta"></p>

        <button class="btn btn-primary btn-lg" id="btnCobrar" style="width:100%;margin-top:16px" disabled>Cobrar</button>

  $('irCaja')?.addEventListener('click', () => irA('caja'));
  montarBuscador('buscarVenta', 'resVenta', agregarAlCarrito);
  $('camVenta').onclick = () => escanear(c => elegirPorCodigo(c, agregarAlCarrito));
  $('descuento').oninput = pintarCarrito;
  $('pagaCon').oninput = calcularCambio;
  $('medios').querySelectorAll('[data-medio]').forEach(b => b.onclick = () => { E.medio = b.dataset.medio; pintarMedio(); });
  $('zonaEfectivo').querySelectorAll('[data-b]').forEach(b => b.onclick = () => {

    else if (v === 'limpiar') inp.value = '';
    else inp.value = Number(inp.value || 0) + Number(v);
    calcularCambio();
  });
  $('clienteVenta').onchange = () => { E.clienteVenta = Number($('clienteVenta').value) || null; pintarSaldoCliente(); };

  $('btnVaciar').onclick = async () => { if (E.carrito.length && await preguntar('Vaciar venta', '¿Quitar todos los productos de esta venta?', { ok: 'Vaciar', peligro: true })) { E.carrito = []; pintarCarrito(); } };

function pintarMedio() {
  $('medios').querySelectorAll('[data-medio]').forEach(b => b.classList.toggle('activa', b.dataset.medio === E.medio));
  $('zonaEfectivo').classList.toggle('hidden', E.medio !== 'efectivo');
  $('zonaFiado').classList.toggle('hidden', E.medio !== 'fiado');
  if (E.medio === 'fiado') {
    $('clienteVenta').innerHTML = '<option value="">Elige el cliente...</option>' + E.clientes.map(c => `<option value="${c.id}" ${E.clienteVenta === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    pintarSaldoCliente();
  }
}
function pintarSaldoCliente() {
  const c = E.clientes.find(x => x.id === E.clienteVenta);
  $('saldoClienteVenta').textContent = c ? `Debe actualmente ${pesos(c.saldo)}` : '';
}

function agregarAlCarrito(p) {
  const item = E.carrito.find(i => i.id === p.id);
  if (item) { if (!esGranel(p)) item.cantidad += 1; }
  else E.carrito.push({ id: p.id, cantidad: 1 });
  pintarCarrito();
  if (esGranel(p)) {
    const inp = document.querySelector(`[data-cant="${p.id}"]`);
    if (inp) { inp.focus(); inp.select(); return; }
  }
  $('buscarVenta')?.focus();
}

function pintarCarrito() {
  const tb = $('tablaCarrito');
  if (!tb) return;
  tb.innerHTML = E.carrito.length ? E.carrito.map(i => {
    const p = prodPorId(i.id);
    const falta = i.cantidad > p.stock;
    return `<tr>
      <td><strong>${esc(p.nombre)}</strong><br><span class="small" style="color:${falta ? 'var(--danger)' : 'var(--muted)'}">Disponible: ${numero(p.stock)} ${esc(UNIDADES[p.unidad]?.toLowerCase() || '')}${falta ? ' · no alcanza' : ''}</span></td>
      <td class="num">${pesos(p.precio_venta)}</td>
      <td class="num"><input class="cant" type="number" data-cant="${p.id}" min="0" step="${esGranel(p) ? '0.01' : '1'}" value="${i.cantidad}"></td>
      <td class="num"><strong>${pesos(i.cantidad * p.precio_venta)}</strong></td>
      <td><button class="quitar" data-quitar="${p.id}" title="Quitar">✕</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="vacio">Escanea o busca un producto para empezar la venta.</td></tr>`;

  tb.querySelectorAll('[data-cant]').forEach(inp => {
    inp.onchange = () => {
      const n = Number(inp.value), id = Number(inp.dataset.cant);
      if (n > 0) E.carrito.find(x => x.id === id).cantidad = n; else E.carrito = E.carrito.filter(x => x.id !== id);
      pintarCarrito();
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { inp.blur(); $('buscarVenta').focus(); } };
  });
  tb.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => { E.carrito = E.carrito.filter(x => x.id !== Number(b.dataset.quitar)); pintarCarrito(); });

  const { sub, total } = totalesVenta();
  $('vSub').textContent = pesos(sub);
  $('vTotal').textContent = pesos(total);
  $('btnCobrar').disabled = !E.carrito.length || !E.caja;
  calcularCambio();
}

function calcularCambio() {
  const { total } = totalesVenta();
  const v = $('pagaCon').value, pago = Number(v || 0), caja = $('cajaCambio');
  caja.classList.remove('ok', 'falta');
  if (!v || !total) { $('txtCambio').textContent = 'Cambio a devolver'; $('valCambio').textContent = '$0'; }
  else if (pago >= total) { caja.classList.add('ok'); $('txtCambio').textContent = 'Cambio a devolver'; $('valCambio').textContent = pesos(pago - total); }
  else { caja.classList.add('falta'); $('txtCambio').textContent = 'Le falta pagar'; $('valCambio').textContent = pesos(total - pago); }
}

let cobrando = false;
async function cobrar() {
  if (cobrando || !E.carrito.length) return;
  if (!E.caja) return aviso('Primero abre la caja.', 'error');
  const faltan = E.carrito.filter(i => i.cantidad > prodPorId(i.id).stock);
  if (faltan.length) return aviso('No hay suficiente stock de: ' + faltan.map(i => prodPorId(i.id).nombre).join(', '), 'error');
  const { desc, total } = totalesVenta();
  const pagoTxt = $('pagaCon').value, pago = pagoTxt ? Number(pagoTxt) : null;
  if (E.medio === 'efectivo' && pago !== null && pago < total) return aviso(`Faltan ${pesos(total - pago)} para completar el pago.`, 'error');
  if (E.medio === 'fiado' && !E.clienteVenta) return aviso('Elige el cliente al que le vas a fiar.', 'error');

  cobrando = true; $('btnCobrar').disabled = true;
  const items = E.carrito.map(i => ({ producto_id: i.id, cantidad: i.cantidad }));
  const lineas = E.carrito.map(i => { const p = prodPorId(i.id); return { nombre: p.nombre, cantidad: i.cantidad, precio: Number(p.precio_venta) }; });
  const { data: v, error } = await db.rpc('registrar_venta', {
    p_items: items, p_medio: E.medio, p_pago_con: E.medio === 'efectivo' ? pago : null,
    p_descuento: desc, p_cliente: E.medio === 'fiado' ? E.clienteVenta : null, p_caja: E.caja.id,
  });
  cobrando = false;
  if (error) { $('btnCobrar').disabled = false; return aviso(errorTexto(error), 'error'); }

  const cliente = E.clientes.find(c => c.id === E.clienteVenta);
  const datos = { ...v, lineas, cliente: E.medio === 'fiado' ? cliente : null, cajero: E.nombre };
  E.carrito = []; E.clienteVenta = null; E.medio = 'efectivo';
  await cargarDatos();
  verVender();
  modalVentaHecha(datos);
}

function modalVentaHecha(v) {
  const m = abrirModal(`

      <div class="badge ok" style="font-size:.9rem">Venta #${v.numero} registrada</div>

      <div class="muted">${MEDIOS[v.medio_pago]}${v.cliente ? ' · ' + esc(v.cliente.nombre) : ''}</div>

    </div>
    <div class="modal-acciones" style="justify-content:center">
      <button class="btn" id="mvImprimir">${ico('imprimir')}Imprimir tiquete</button>

}

async function resumenCaja(caja) {
  const [ventas, abonos] = await Promise.all([
    todo(() => db.from('ventas').select('total, medio_pago').eq('caja_id', caja.id).eq('estado', 'activa')),
    todo(() => db.from('abonos').select('valor, medio_pago').eq('caja_id', caja.id)),
  ]);
  const porMedio = {};
  ventas.forEach(v => porMedio[v.medio_pago] = (porMedio[v.medio_pago] || 0) + Number(v.total));
  const abonosEf = abonos.filter(a => a.medio_pago === 'efectivo').reduce((t, a) => t + Number(a.valor), 0);
  const abonosOtros = abonos.filter(a => a.medio_pago !== 'efectivo').reduce((t, a) => t + Number(a.valor), 0);
  const esperado = Number(caja.base) + (porMedio.efectivo || 0) + abonosEf;
  return { ventas: ventas.length, porMedio, abonosEf, abonosOtros, esperado, total: ventas.reduce((t, v) => t + Number(v.total), 0) };
}

async function guardarEntrada() {
  const en = E.entrada;
  const validas = en.lineas.filter(l => Number(l.cantidad) > 0);
  if (!validas.length) return aviso('Escribe la cantidad que llegó de cada producto.', 'error');
  if (validas.length < en.lineas.length && !await preguntar('Líneas sin cantidad', 'Hay productos sin cantidad; esos no se registrarán. ¿Continuar?')) return;
  const prov = nombreProveedor(Number(en.proveedor));
  const nota = [en.factura ? 'Factura ' + en.factura : 'Entrada de mercancía', prov].filter(Boolean).join(' · ');
  const filas = validas.map(l => ({ producto_id: l.id, tipo: 'entrada', cantidad: Number(l.cantidad), precio_unitario: l.costo === '' ? null : Number(l.costo), costo_unitario: l.costo === '' ? null : Number(l.costo), fecha_vencimiento: l.vence || null, nota }));
  $('guardarEntrada').disabled = true;
  const { error } = await db.from('movimientos').insert(filas);
  $('guardarEntrada').disabled = false;
  if (error) return aviso(errorTexto(error), 'error');
  if (esDueno()) {
    for (const l of validas) {
      const p = prodPorId(l.id), cambios = {};
      if (l.costo !== '' && Number(l.costo) !== Number(p.precio_compra)) cambios.precio_compra = Number(l.costo);
      if (en.proveedor && !p.proveedor_id) cambios.proveedor_id = Number(en.proveedor);
      if (Object.keys(cambios).length) await db.from('productos').update(cambios).eq('id', l.id);
    }
  }
  aviso(`Entrada registrada: ${validas.length} producto(s)`, 'ok');
  E.entrada = { lineas: [], proveedor: '', factura: '' };
  await cargarDatos();
  verEntradas();
}

async function porVencerIds() {
  const ent = await todo(() => db.from('movimientos').select('producto_id, fecha_vencimiento').eq('tipo', 'entrada').not('fecha_vencimiento', 'is', null).order('fecha', { ascending: false }));
  const ult = {}; ent.forEach(m => { if (!ult[m.producto_id]) ult[m.producto_id] = m.fecha_vencimiento; });
  const lim = aFecha(sumarDias(new Date(), 30));
  return new Set(Object.entries(ult).filter(([, f]) => f <= lim).map(([id]) => Number(id)));
}

let cacheVence = null;
async function pintarProductos() {
  const f = E.filtroProd, t = f.texto.trim().toLowerCase();
  if (f.estado === 'vence' && !cacheVence) cacheVence = await porVencerIds();
  const lista = E.productos.filter(p =>
    (f.inactivos ? !p.activo : p.activo) &&
    (!t || p.nombre.toLowerCase().includes(t) || (p.codigo_barras || '').includes(t)) &&
    (!f.cat || String(p.categoria_id) === String(f.cat)) &&
    (f.estado !== 'bajo' || (Number(p.stock_minimo) > 0 && p.stock <= Number(p.stock_minimo))) &&
    (f.estado !== 'cero' || p.stock <= 0) &&
    (f.estado !== 'vence' || cacheVence.has(p.id)));

  }).join('') : `<tr><td colspan="${cols}" class="vacio">${E.productos.length ? 'Ningún producto coincide con el filtro.' : 'No hay productos. Crea el primero o impórtalos desde Excel.'}</td></tr>`;
  $('tablaProductos').querySelectorAll('[data-editar]').forEach(b => b.onclick = () => modalProducto(prodPorId(Number(b.dataset.editar))));
  $('tablaProductos').querySelectorAll('[data-ajustar]').forEach(b => b.onclick = () => modalAjuste(prodPorId(Number(b.dataset.ajustar))));

    const nuevo = conteo ? Number(v) : p.stock - Number(v);
    el('#aRes').textContent = v === '' ? '' : `El stock quedará en ${numero(nuevo)} (${nuevo - p.stock >= 0 ? '+' : ''}${numero(nuevo - p.stock)})`;
  };

    const v = el('#aCant').value;

    const conteo = el('#aMotivo').value === 'conteo';

    const motivo = conteo ? 'Conteo físico' : el('#aMotivo').value;
    const { error } = await db.from('movimientos').insert({
      producto_id: p.id, tipo: dif > 0 ? 'ajuste_entrada' : 'baja', cantidad: Math.abs(dif),

  };
}

const normalizar = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim().replace(/\s+/g, '_');

  ];

async function importarExcel() {
  try { await cargarExcel(); } catch (e) { return aviso(errorTexto(e), 'error'); }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    let filas;
    try {
      const wb = XLSX.read(await file.arrayBuffer());
      filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }).map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [normalizar(k), v])));
    } catch (e) { return aviso('No se pudo leer el archivo: ' + errorTexto(e), 'error'); }
    const val = (r, ...ks) => { for (const k of ks) if (r[k] !== undefined && r[k] !== '') return r[k]; return ''; };
    const nuevos = [], actualizar = [], errores = [];
    filas.forEach((r, i) => {
      const nombre = String(val(r, 'nombre', 'producto', 'descripcion')).trim();
      const codigo = String(val(r, 'codigo_barras', 'codigo', 'codigo_de_barras')).trim();
      if (!nombre) { if (Object.values(r).some(v => v !== '')) errores.push(`Fila ${i + 2}: sin nombre`); return; }
      let unidad = normalizar(val(r, 'unidad') || 'unidad'); if (!UNIDADES[unidad]) unidad = 'unidad';
      const fila = { nombre, codigo_barras: codigo || null, categoria: String(val(r, 'categoria')).trim(), unidad,
        precio_compra: Number(val(r, 'precio_compra', 'costo')) || 0, precio_venta: Number(val(r, 'precio_venta', 'precio')) || 0,
        stock_minimo: Number(val(r, 'stock_minimo', 'minimo')) || 0, stock_inicial: Number(val(r, 'stock_inicial', 'stock', 'cantidad')) || 0 };
      const existe = codigo ? E.productos.find(p => p.codigo_barras === codigo) : E.productos.find(p => p.nombre.toLowerCase() === nombre.toLowerCase());
      if (existe) actualizar.push({ existe, fila }); else nuevos.push(fila);
    });
    const ok = await preguntar('Importar productos', `Archivo: ${file.name}\n\n• ${nuevos.length} productos nuevos (con su stock inicial)\n• ${actualizar.length} productos existentes: se actualizan precios, categoría y mínimo (el stock no cambia)${errores.length ? `\n• ${errores.length} filas con error se omitirán` : ''}\n\n¿Continuar?`, { ok: 'Importar' });
    if (!ok) return;
    aviso('Importando...');
    try {
      // Categorías que no existen
      const cats = [...new Set([...nuevos, ...actualizar.map(a => a.fila)].map(f => f.categoria).filter(Boolean))];
      const faltan = cats.filter(c => !E.categorias.find(x => x.nombre.toLowerCase() === c.toLowerCase()));
      if (faltan.length) { const { error } = await db.from('categorias').insert(faltan.map(nombre => ({ nombre }))); if (error) throw error; }
      const { data: catsDb } = await db.from('categorias').select('*');
      const idCat = n => n ? catsDb.find(c => c.nombre.toLowerCase() === n.toLowerCase())?.id || null : null;
      // Nuevos en bloques
      for (let i = 0; i < nuevos.length; i += 200) {
        const lote = nuevos.slice(i, i + 200);
        const { data, error } = await db.from('productos').insert(lote.map(f => ({ nombre: f.nombre, codigo_barras: f.codigo_barras, categoria_id: idCat(f.categoria), unidad: f.unidad, precio_compra: f.precio_compra, precio_venta: f.precio_venta, stock_minimo: f.stock_minimo }))).select('id, nombre, codigo_barras');
        if (error) throw error;
        const entradas = lote.map((f, j) => ({ f, p: data.find(d => f.codigo_barras ? d.codigo_barras === f.codigo_barras : d.nombre === f.nombre) || data[j] }))
          .filter(x => x.f.stock_inicial > 0 && x.p)
          .map(x => ({ producto_id: x.p.id, tipo: 'entrada', cantidad: x.f.stock_inicial, precio_unitario: x.f.precio_compra, costo_unitario: x.f.precio_compra, nota: 'Inventario inicial (Excel)' }));
        if (entradas.length) { const r = await db.from('movimientos').insert(entradas); if (r.error) throw r.error; }
      }
      for (const { existe, fila } of actualizar) {
        await db.from('productos').update({ precio_compra: fila.precio_compra || existe.precio_compra, precio_venta: fila.precio_venta || existe.precio_venta, stock_minimo: fila.stock_minimo || existe.stock_minimo, categoria_id: idCat(fila.categoria) || existe.categoria_id }).eq('id', existe.id);
      }
      await cargarDatos(); verProductos();
      aviso(`Importación lista: ${nuevos.length} nuevos, ${actualizar.length} actualizados`, 'ok');
    } catch (e) { aviso('Error al importar: ' + errorTexto(e), 'error'); await cargarDatos(); verProductos(); }
  };
  inp.click();
}

function rangoPeriodo() {
  const hoy = inicioDia(new Date());
  let d = new Date(hoy), h = new Date(hoy);
  const p = E.periodo;
  if (p === 'ayer') { d = sumarDias(hoy, -1); h = new Date(d); }
  if (p === 'semana') d = sumarDias(hoy, -((hoy.getDay() + 6) % 7));
  if (p === 'mes') d = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  if (p === 'mesant') { d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); h = new Date(hoy.getFullYear(), hoy.getMonth(), 0); }
  if (p === 'anio') d = new Date(hoy.getFullYear(), 0, 1);
  if (p === 'rango') { d = new Date(E.desde + 'T00:00:00'); h = new Date(E.hasta + 'T00:00:00'); }
  return { d, h, fin: sumarDias(h, 1) };
}

  const { d, h } = rangoPeriodo();
  $('contenido').innerHTML = encabezado('Reportes', 'Ventas, ganancia y movimiento de productos', `<button class="btn" id="btnExportar">${ico('excel')}Exportar a Excel</button>`) +
    `<div class="periodos">${Object.entries(per).map(([k, v]) => `<button class="chip ${E.periodo === k ? 'activa' : ''}" data-p="${k}">${v}</button>`).join('')}
      <div><label>Desde</label><input type="date" class="fecha" id="rDesde" value="${aFecha(d)}"></div>
      <div><label>Hasta</label><input type="date" class="fecha" id="rHasta" value="${aFecha(h)}"></div>
      <button class="btn" id="rVer">Ver</button></div>
    <div id="rCuerpo" class="muted">Cargando...</div>`;
  $('contenido').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { E.periodo = b.dataset.p; verReportes(); });
  $('rVer').onclick = () => { E.periodo = 'rango'; E.desde = $('rDesde').value; E.hasta = $('rHasta').value; if (E.desde && E.hasta) verReportes(); };
  $('btnExportar').onclick = exportarReporte;

  let ventas;
  try {
    const r = rangoPeriodo();
    ventas = await todo(() => db.from('ventas').select('*, movimientos(producto_id, cantidad, precio_unitario, costo_unitario, tipo)').gte('fecha', r.d.toISOString()).lt('fecha', r.fin.toISOString()).order('fecha', { ascending: false }));
  } catch (e) { if ($('rCuerpo')) $('rCuerpo').textContent = errorTexto(e); return; }
  if (!$('rCuerpo')) return;

  const activas = ventas.filter(v => v.estado === 'activa');
  const lineas = activas.flatMap(v => (v.movimientos || []).filter(m => m.tipo === 'venta'));
  const costoLinea = m => Number(m.cantidad) * Number(m.costo_unitario ?? prodPorId(m.producto_id)?.precio_compra ?? 0);
  const total = activas.reduce((t, v) => t + Number(v.total), 0);
  const costo = lineas.reduce((t, m) => t + costoLinea(m), 0);
  const descuentos = activas.reduce((t, v) => t + Number(v.descuento || 0), 0);

  // Por fecha
  const dias = (r => (r.h - r.d) / 864e5)(rangoPeriodo());
  const porMes = dias > 62;
  const grupos = {};
  activas.forEach(v => {
    const f = new Date(v.fecha);
    const k = porMes ? `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, '0')}` : aFecha(f);
    const g = grupos[k] ||= { n: 0, total: 0, f }; g.n++; g.total += Number(v.total);
  });
  const fFecha = Object.entries(grupos).sort((a, b) => b[0].localeCompare(a[0]));
  const maxF = Math.max(1, ...fFecha.map(([, g]) => g.total));
  // Por medio y por cajero
  const porMedio = {}, porCajero = {};
  activas.forEach(v => {
    (porMedio[v.medio_pago] ||= { n: 0, t: 0 }); porMedio[v.medio_pago].n++; porMedio[v.medio_pago].t += Number(v.total);
    (porCajero[v.usuario_id] ||= { n: 0, t: 0 }); porCajero[v.usuario_id].n++; porCajero[v.usuario_id].t += Number(v.total);
  });
  // Productos
  const prods = {};
  lineas.forEach(m => { const p = prods[m.producto_id] ||= { c: 0, t: 0, g: 0 }; const venta = Number(m.cantidad) * Number(m.precio_unitario || 0); p.c += Number(m.cantidad); p.t += venta; p.g += venta - costoLinea(m); });
  const fProd = Object.entries(prods).sort((a, b) => b[1].t - a[1].t);
  const sinMov = activos().filter(p => p.stock > 0 && !prods[p.id]);

  datosReporte = { ventas, prods: fProd, total, costo };
  const tabla = (cab, filas, vacio = 'Sin datos en este periodo.') => `<div class="tabla-wrap"><table><thead><tr>${cab}</tr></thead><tbody>${filas || `<tr><td colspan="9" class="vacio">${vacio}</td></tr>`}</tbody></table></div>`;

  $('rCuerpo').className = '';
  $('rCuerpo').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>Total vendido</span><strong>${pesos(total)}</strong></div>
      <div class="kpi bueno"><span>Ganancia</span><strong>${pesos(total - costo)}</strong></div>
      <div class="kpi"><span>Margen</span><strong>${total ? Math.round((total - costo) / total * 100) : 0}%</strong></div>
      <div class="kpi"><span>Ventas</span><strong>${activas.length}</strong></div>
      <div class="kpi"><span>Venta promedio</span><strong>${pesos(activas.length ? total / activas.length : 0)}</strong></div>
      <div class="kpi"><span>Descuentos</span><strong>${pesos(descuentos)}</strong></div>
    </div>
    <div class="dos-col">
      <div><h3 style="margin:4px 0 8px">${porMes ? 'Ventas por mes' : 'Ventas por día'}</h3>${tabla('<th>Fecha</th><th class="num">Ventas</th><th class="num">Total</th>', fFecha.map(([, g]) => `<tr><td>${porMes ? MESES[g.f.getMonth()] + ' ' + g.f.getFullYear() : g.f.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' })}<div class="barra-mini"><i style="width:${g.total / maxF * 100}%"></i></div></td><td class="num">${g.n}</td><td class="num"><strong>${pesos(g.total)}</strong></td></tr>`).join(''))}</div>
      <div><h3 style="margin:4px 0 8px">Por medio de pago</h3>${tabla('<th>Medio</th><th class="num">Ventas</th><th class="num">Total</th>', Object.entries(porMedio).sort((a, b) => b[1].t - a[1].t).map(([k, x]) => `<tr><td>${MEDIOS[k] || k}</td><td class="num">${x.n}</td><td class="num"><strong>${pesos(x.t)}</strong></td></tr>`).join(''))}
        <h3 style="margin:16px 0 8px">Por cajero</h3>${tabla('<th>Usuario</th><th class="num">Ventas</th><th class="num">Total</th>', Object.entries(porCajero).sort((a, b) => b[1].t - a[1].t).map(([k, x]) => `<tr><td>${esc(nombreUsuario(k))}</td><td class="num">${x.n}</td><td class="num"><strong>${pesos(x.t)}</strong></td></tr>`).join(''))}</div>
    </div>
    <div class="dos-col" style="margin-top:16px">
      <div><h3 style="margin:4px 0 8px">Productos más vendidos</h3>${tabla('<th>Producto</th><th class="num">Cantidad</th><th class="num">Vendido</th><th class="num">Ganancia</th>', fProd.slice(0, 20).map(([id, x]) => `<tr><td>${esc(prodPorId(Number(id))?.nombre || '—')}</td><td class="num">${numero(x.c)}</td><td class="num">${pesos(x.t)}</td><td class="num" style="color:var(--ok)">${pesos(x.g)}</td></tr>`).join(''))}</div>
      <div><h3 style="margin:4px 0 8px">Sin ventas en el periodo (con stock)</h3>${tabla('<th>Producto</th><th class="num">Stock</th><th class="num">Valor en costo</th>', sinMov.sort((a, b) => b.stock * b.precio_compra - a.stock * a.precio_compra).slice(0, 20).map(p => `<tr><td>${esc(p.nombre)}</td><td class="num">${numero(p.stock)}</td><td class="num">${pesos(p.stock * p.precio_compra)}</td></tr>`).join(''), 'Todos los productos con stock tuvieron ventas.')}</div>
    </div>
    <h3 style="margin:20px 0 8px">Detalle de ventas</h3>
    ${tabla('<th>#</th><th>Fecha</th><th>Productos</th><th>Pago</th><th>Usuario</th><th class="num">Total</th><th></th>', ventas.slice(0, 200).map(v => `<tr style="${v.estado === 'anulada' ? 'opacity:.55' : ''}">
      <td>${v.numero ?? ''}</td><td class="small">${fechaHora(v.fecha)}</td>
      <td class="small">${(v.movimientos || []).filter(m => m.tipo === 'venta').map(m => `${numero(m.cantidad)} × ${esc(prodPorId(m.producto_id)?.nombre || '—')}`).join('<br>')}</td>
      <td>${MEDIOS[v.medio_pago] || v.medio_pago}${v.cliente_id ? `<br><span class="small muted">${esc(E.clientes.find(c => c.id === v.cliente_id)?.nombre || '')}</span>` : ''}</td>
      <td>${esc(nombreUsuario(v.usuario_id))}</td>
      <td class="num"><strong>${pesos(v.total)}</strong>${v.estado === 'anulada' ? '<br><span class="badge bajo">Anulada</span>' : ''}</td>
      <td class="num" style="white-space:nowrap"><button class="link" data-reimp="${v.id}">Tiquete</button>${v.estado === 'activa' ? `<button class="link danger" data-anular="${v.id}">Anular</button>` : ''}</td></tr>`).join(''))}
    ${ventas.length > 200 ? `<p class="small muted">Se muestran las 200 más recientes de ${ventas.length}. Exporta a Excel para verlas todas.</p>` : ''}`;

  const ventaPorId = id => ventas.find(v => v.id === Number(id));
  $('rCuerpo').querySelectorAll('[data-reimp]').forEach(b => b.onclick = () => {
    const v = ventaPorId(b.dataset.reimp);
    imprimirTiquete({ ...v, cajero: nombreUsuario(v.usuario_id), cliente: E.clientes.find(c => c.id === v.cliente_id),
      lineas: (v.movimientos || []).filter(m => m.tipo === 'venta').map(m => ({ nombre: prodPorId(m.producto_id)?.nombre || '—', cantidad: Number(m.cantidad), precio: Number(m.precio_unitario) })) });
  });
  $('rCuerpo').querySelectorAll('[data-anular]').forEach(b => b.onclick = async () => {
    const v = ventaPorId(b.dataset.anular);
    const motivo = await preguntar(`Anular venta #${v.numero}`, `Total ${pesos(v.total)}. Los productos regresan al inventario y la venta deja de contar en los reportes.`, { ok: 'Anular venta', peligro: true, campo: 'Motivo' });
    if (!motivo) return;
    const { error } = await db.rpc('anular_venta', { p_venta: v.id, p_motivo: motivo === true ? null : motivo });
    if (error) return aviso(errorTexto(error), 'error');
    aviso(`Venta #${v.numero} anulada`, 'ok'); await cargarDatos(); verReportes();
  });
}

async function exportarReporte() {
  if (!datosReporte) return;
  try { await cargarExcel(); } catch (e) { return aviso(errorTexto(e), 'error'); }
  const { d, h } = rangoPeriodo();
  const ventas = datosReporte.ventas.map(v => ({
    Numero: v.numero, Fecha: fechaHora(v.fecha), Estado: v.estado, Medio: MEDIOS[v.medio_pago] || v.medio_pago,
    Cliente: E.clientes.find(c => c.id === v.cliente_id)?.nombre || '', Usuario: E.usuarios[v.usuario_id] || '',
    Subtotal: Number(v.subtotal), Descuento: Number(v.descuento), Total: Number(v.total),
    Productos: (v.movimientos || []).filter(m => m.tipo === 'venta').map(m => `${m.cantidad} x ${prodPorId(m.producto_id)?.nombre || ''}`).join('; '),
  }));
  const prods = datosReporte.prods.map(([id, x]) => ({ Producto: prodPorId(Number(id))?.nombre || '', Cantidad: x.c, Vendido: Math.round(x.t), Ganancia: Math.round(x.g) }));
  const inv = activos().map(p => ({ Codigo: p.codigo_barras || '', Producto: p.nombre, Categoria: nombreCategoria(p.categoria_id), Unidad: p.unidad, 'Precio compra': Number(p.precio_compra), 'Precio venta': Number(p.precio_venta), Stock: p.stock, 'Stock minimo': Number(p.stock_minimo), 'Valor costo': Math.round(Math.max(p.stock, 0) * p.precio_compra) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ventas.length ? ventas : [{ Numero: 'Sin ventas' }]), 'Ventas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prods.length ? prods : [{ Producto: 'Sin ventas' }]), 'Productos vendidos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inv), 'Inventario');
  XLSX.writeFile(wb, `reporte_${aFecha(d)}_a_${aFecha(h)}.xlsx`);
}

  });

function reducirImagen(file, max) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      ok(cv.toDataURL('image/png'));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = mal;
    img.src = URL.createObjectURL(file);
  });
}

/* =====================================================================
   ESCÁNER (CÁMARA)
   ===================================================================== */
let lector = null;
async function escanear(alLeer) {
  const m = abrirModal(`<h2>Escanear código</h2><div id="lector"></div><p class="small muted" style="text-align:center">Apunta la cámara al código de barras o QR.</p><p class="msg error" id="errEsc"></p>
    <div class="modal-acciones"><button class="btn" data-cerrar>Cancelar</button></div>`, { alCerrar: detenerLector });
  try {
    const F = Html5QrcodeSupportedFormats;
    lector = new Html5Qrcode('lector', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.QR_CODE], useBarCodeDetectorIfSupported: true });
    await lector.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 160 } }, codigo => {
      if (navigator.vibrate) navigator.vibrate(80);
      m.cerrar();
      alLeer(codigo.trim());
    });
  } catch (e) { const er = m.el.querySelector('#errEsc'); if (er) er.textContent = 'No se pudo abrir la cámara. Revisa el permiso de cámara del navegador.'; }
}
async function detenerLector() {
  const l = lector; lector = null;
  if (l) { try { if (l.isScanning) await l.stop(); l.clear(); } catch (e) {} }
}

/* =====================================================================
   ATAJOS, CONEXIÓN Y ARRANQUE
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pilaModales.length) { pilaModales.at(-1).cerrar(); return; }
  if ($('app').classList.contains('hidden') || pilaModales.length) return;
  if (e.key === 'F1') { e.preventDefault(); if (E.tienda) irA('vender'); }
  if (e.key === 'F2' && E.vista === 'vender') { e.preventDefault(); cobrar(); }
});
const pintarConexion = () => $('offline').classList.toggle('hidden', navigator.onLine);
window.addEventListener('online', pintarConexion);
window.addEventListener('offline', pintarConexion);
pintarConexion();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

aplicarTema(leerLocal('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
iniciar();
</script>
